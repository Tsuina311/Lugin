# Publish the phone app to GitHub Pages.
#
# The extension is not built here — it goes to the Chrome Web Store as a signed
# package (see docs/DISTRIBUTION.md). This deploys only the web build.
#
# The Google client id is read from a repository *variable*, not a secret: it
# ships inside the bundle either way, and pretending otherwise would just make it
# awkward to rotate. There is no client secret in this app at all.

name: Deploy phone app to Pages

on:
  push:
    branches: [main]
  # Daily, for the price snapshot rather than the code: Scryfall refreshes its
  # bulk dump every morning, and a collection's value is only as current as the
  # last deploy. 10:30 UTC leaves comfortable room after their ~09:05 rebuild.
  schedule:
    - cron: '30 10 * * *'
  # So a deploy can be triggered without a commit, e.g. after setting the variable.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

# A superseded deploy is worth cancelling; a half-finished one is not.
concurrency:
  cancel-in-progress: false
  group: pages

jobs:
  goldfish-proxy:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.proxy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - run: yarn install --immutable
      - name: Deploy Goldfish proxy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
        # No token yet — skip quietly; build falls back to vars.VITE_LUGIN_GOLDFISH_PROXY_URL.
        continue-on-error: true
      - name: Capture proxy URL
        id: proxy
        run: |
          if [ -n "${{ steps.deploy.outputs.deployment-url }}" ]; then
            echo "url=${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [goldfish-proxy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version's third number is the commit count, and the default
          # shallow fetch can only count the one commit it took. Without this the
          # deployed app would call itself 1.0.1 forever while the phone that
          # pushed it says 1.0.87.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `yarn` has to mean 3.8.1, as package.json's packageManager field declares.
      # The runner ships Yarn 1, which refuses to run in a project pinned to 3, and
      # Corepack is what resolves that. It has to come *after* setup-node, because
      # the shims belong to whichever Node is on PATH — which is also why
      # setup-node can't use `cache: yarn`: that probe runs `yarn cache dir`
      # while Yarn 1 is still in charge, and fails the job before install.
      - name: Enable Corepack
        run: corepack enable

      - run: yarn install --immutable

      # All of them, not just the render checks: import, prices and sync are where
      # a quiet mistake costs someone their collection or misprices it, and they
      # take seconds.
      - name: Tests
        run: yarn test

      - name: Build
        env:
          # Pages serves a project site from /<repo>/, so every asset URL needs
          # that prefix compiled in. Taken from the repo name so a rename can't
          # quietly break the deploy.
          LUGIN_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # CORS proxy for MTGGoldfish (see workers/goldfish-proxy.js).
          VITE_LUGIN_GOLDFISH_PROXY_URL: ${{ needs.goldfish-proxy.outputs.url || vars.VITE_LUGIN_GOLDFISH_PROXY_URL }}
        run: yarn build:web

      # Every paper price in Magic, distilled to ~3.5 MB (about 1.2 MB over the
      # wire) so a phone can hold the whole table and value a collection without
      # asking about one card at a time. Deployed beside the app, which is what
      # makes it readable by the extension too — Pages sends
      # `access-control-allow-origin: *`.
      #
      # Not fatal: a failed dump should not block a code deploy. The app treats a
      # missing snapshot as "no prices yet" and says so.
      - name: Price snapshot
        continue-on-error: true
        run: node scripts/build-prices.mjs --out dist-web/prices.json

      # Every card name, plus the French, German and Italian titles they are
      # printed under, so the scanner can identify a card against the real list
      # instead of asking Scryfall what it just read. ~1.2 MB over the wire,
      # downloaded on first scan rather than at launch.
      #
      # Same bargain as the prices above: not fatal. Without it the scanner falls
      # back to Scryfall's fuzzy endpoint, which works but needs signal and cannot
      # offer alternatives.
      - name: Card name index
        continue-on-error: true
        run: node scripts/build-card-index.mjs --out dist-web/card-names.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
