# Deploy Lugin web (GitHub Pages) and native Android development (EAS).
#
# Job graph after the shared gate:
#
#   gate ──┬── deploy-web → deploy-pages
#          └── deploy-native-development  (no-ops with warning if EXPO_TOKEN missing)
#
# Web never depends on EAS availability. Native uses Expo fingerprint:
# matching finished development build → EAS Update OTA; otherwise → EAS Build APK.
#
# Scheduled runs refresh the web price snapshot only (no native deploy).

name: Deploy Lugin

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  # Cancel superseded GH jobs (including queued OTA steps). An EAS Build already
  # submitted to Expo continues on Expo's side — do not cancel that remotely.
  group: lugin-main-deploy
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - run: yarn install --immutable

      # Fast deployment gate — not the heavy scanner corpus / detect-eval suite.
      - name: Typecheck (web/extension)
        run: yarn typecheck

      - name: Shared tests (import, prices, scan unit, corpus unit, sync)
        run: yarn test:import && yarn test:prices && yarn test:scan && yarn test:corpus && yarn test:sync

      - name: Web smoke
        run: yarn test:web

      - name: Mobile typecheck + smoke
        run: yarn mobile:typecheck && yarn mobile:test

  goldfish-proxy:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.proxy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Goldfish proxy
        id: deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is missing"
            exit 1
          fi
          npx --yes wrangler@4 deploy 2>&1 | tee /tmp/wrangler-out.txt
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/wrangler-out.txt | head -1 || true)
          echo "deployment-url=${URL}" >> "$GITHUB_OUTPUT"
          test -n "$URL"
      - name: Capture proxy URL
        id: proxy
        run: |
          if [ -n "${{ steps.deploy.outputs.deployment-url }}" ]; then
            echo "url=${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.deploy.outcome }}" != "success" ]; then
            echo "::warning::Goldfish proxy deploy failed. Check CLOUDFLARE_API_TOKEN and that workers.dev is registered, or set repository variable VITE_LUGIN_GOLDFISH_PROXY_URL manually."
          fi

  deploy-web:
    needs: [gate, goldfish-proxy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - run: yarn install --immutable

      - name: Build web
        env:
          LUGIN_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_LUGIN_GOLDFISH_PROXY_URL: ${{ needs.goldfish-proxy.outputs.url || vars.VITE_LUGIN_GOLDFISH_PROXY_URL }}
        run: yarn build:web

      - name: Price snapshot
        continue-on-error: true
        run: node scripts/build-prices.mjs --out dist-web/prices.json

      - name: Card name index
        continue-on-error: true
        run: node scripts/build-card-index.mjs --out dist-web/card-names.json

      - name: Artwork index (fixtures)
        continue-on-error: true
        run: node scripts/build-art-index.mjs --from-fixtures --out dist-web/art-index.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: deploy-web
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-native-development:
    # Android development only. Skip price-cron schedule. Skip body when no token
    # so web deploys still succeed before EAS is configured.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require EXPO_TOKEN
        id: auth
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::EXPO_TOKEN secret missing — skipping native deploy. Web Pages still deploys."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.auth.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Enable Corepack
        if: steps.auth.outputs.skip != 'true'
        run: corepack enable

      - name: Install
        if: steps.auth.outputs.skip != 'true'
        run: yarn install --immutable

      - name: Setup EAS
        if: steps.auth.outputs.skip != 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Resolve EAS project id
        if: steps.auth.outputs.skip != 'true'
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: |
          if [ -z "${EAS_PROJECT_ID:-}" ]; then
            ID=$(node -e "try{const j=require('./mobile/eas-project.json');process.stdout.write(j.projectId||'')}catch{process.stdout.write('')}")
            if [ -z "$ID" ]; then
              echo "::error::Set repository variable EAS_PROJECT_ID or mobile/eas-project.json after \`cd mobile && eas init\`."
              exit 1
            fi
            echo "EAS_PROJECT_ID=$ID" >> "$GITHUB_ENV"
          else
            echo "EAS_PROJECT_ID=$EAS_PROJECT_ID" >> "$GITHUB_ENV"
          fi

      - name: Fingerprint decide
        if: steps.auth.outputs.skip != 'true'
        id: decide
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ env.EAS_PROJECT_ID }}
          LUGIN_EAS_PROFILE: development
          LUGIN_EAS_ENVIRONMENT: development
          LUGIN_EAS_CHANNEL: development
        run: node scripts/mobile-eas.mjs decide

      - name: Publish OTA (fingerprint unchanged)
        if: steps.auth.outputs.skip != 'true' && steps.decide.outputs.mode == 'ota'
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ env.EAS_PROJECT_ID }}
        run: |
          eas update \
            --channel development \
            --platform android \
            --environment development \
            --message "main ${GITHUB_SHA}" \
            --non-interactive

      - name: Summarize OTA
        if: steps.auth.outputs.skip != 'true' && steps.decide.outputs.mode == 'ota'
        env:
          LUGIN_FINGERPRINT: ${{ steps.decide.outputs.fingerprint }}
          LUGIN_COMMIT: ${{ steps.decide.outputs.commit }}
        run: node scripts/mobile-eas.mjs summary-ota

      - name: Build development APK (fingerprint changed)
        if: steps.auth.outputs.skip != 'true' && steps.decide.outputs.mode == 'build'
        id: build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ env.EAS_PROJECT_ID }}
        run: |
          # Wait for the build so the install URL is available in the summary.
          # Do NOT publish an OTA for this fingerprint — the new APK embeds JS.
          eas build \
            --platform android \
            --profile development \
            --non-interactive \
            --json > /tmp/eas-build.json
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('/tmp/eas-build.json', 'utf8').trim();
          const startObj = text.lastIndexOf('{');
          const startArr = text.lastIndexOf('[');
          const start = Math.max(startObj, startArr);
          if (start < 0) throw new Error('no JSON from eas build');
          const parsed = JSON.parse(text.slice(start));
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          const id = build.id || '';
          const url =
            build.artifacts?.buildUrl ||
            build.artifacts?.applicationArchiveUrl ||
            build.appBuildUrl ||
            (id ? `https://expo.dev/builds/${id}` : '');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `build_id=${id}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `install_url=${url}\n`);
          NODE

      - name: Summarize native build
        if: steps.auth.outputs.skip != 'true' && steps.decide.outputs.mode == 'build'
        env:
          LUGIN_FINGERPRINT: ${{ steps.decide.outputs.fingerprint }}
          LUGIN_COMMIT: ${{ steps.decide.outputs.commit }}
          LUGIN_BUILD_ID: ${{ steps.build.outputs.build_id }}
          LUGIN_INSTALL_URL: ${{ steps.build.outputs.install_url }}
        run: node scripts/mobile-eas.mjs summary-build
