plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.lugin.mobile'
version = '0.1.0'

android {
  namespace "expo.modules.lugincarddetector"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests.includeAndroidResources = false
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
