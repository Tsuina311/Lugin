plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.lugin.mobile'
version = '0.1.0'

android {
  namespace "expo.modules.luginocr"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    minSdkVersion 24
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Bundled Latin script model (Text Recognition v2). Offline; no Play Services download.
  implementation("com.google.mlkit:text-recognition:16.0.1")
}
