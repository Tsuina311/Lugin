plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.lugin.mobile'
version = '0.1.0'

android {
  namespace "expo.modules.luginvisual"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    minSdkVersion 24
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // ONNX Runtime Android — CLIP ViT-B/32 quantized inference.
  implementation("com.microsoft.onnxruntime:onnxruntime-android:1.19.2")
}
