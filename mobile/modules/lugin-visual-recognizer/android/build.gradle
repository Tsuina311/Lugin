plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.lugin.mobile'
version = '0.1.0'

def vnextParityEnabled = System.getenv("APP_ENV") == "development"

android {
  namespace "expo.modules.luginvisual"
  buildFeatures {
    buildConfig true
  }
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    minSdkVersion 24
    buildConfigField "boolean", "VNEXT_PARITY_ENABLED", vnextParityEnabled.toString()
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // ONNX Runtime Android — CLIP ViT-B/32 quantized inference.
  implementation("com.microsoft.onnxruntime:onnxruntime-android:1.19.2")
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
